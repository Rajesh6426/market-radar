<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Momentum & Fundamental Radar</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-white: #f0f6fc;
      --tag-green: #2ea043;
      --tag-neutral: #8b949e;
      --link: #58a6ff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h1 {
      color: var(--text-white);
      margin: 0 0 8px 0;
      font-size: 24px;
    }
    .timestamp {
      font-size: 13px;
      color: #8b949e;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-match {
      background: rgba(46, 160, 67, 0.2);
      color: #3fb950;
      border: 1px solid rgba(46, 160, 67, 0.4);
    }
    .badge-fund-good {
      background: rgba(56, 139, 253, 0.15);
      color: #58a6ff;
      border: 1px solid rgba(56, 139, 253, 0.3);
    }
    .badge-neutral {
      background: rgba(139, 148, 158, 0.15);
      color: #8b949e;
    }
    .cap-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #21262d;
      color: #8b949e;
      border: 1px solid var(--border);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
      overflow-x: auto;
    }
    h2 {
      color: var(--text-white);
      font-size: 18px;
      margin-top: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    th {
      color: #8b949e;
      font-weight: 600;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    a.symbol-link {
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    a.symbol-link:hover {
      text-decoration: underline;
    }
    .subtext {
      font-size: 11px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎯 High-Conviction Stock Radar</h1>
      <div class="timestamp" id="last-updated">Checking latest cloud scan...</div>
    </header>

    <div class="card">
      <h2>🔥 High-Conviction Matches (Technical Momentum + Strong Fundamentals)</h2>
      <div id="matches-table-container">Loading...</div>
    </div>

    <div class="card">
      <h2>📊 All Monitored Watchlist (Valuation, Market Cap & Solvency)</h2>
      <div id="all-table-container">Loading...</div>
    </div>
  </div>

  <script>
    fetch('results.json?v=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        document.getElementById('last-updated').innerText = `Last Cloud Scan: ${data.last_updated} (${data.match_count || 0} setups found)`;
        
        const matchesContainer = document.getElementById('matches-table-container');
        if (!data.matches || data.matches.length === 0) {
          matchesContainer.innerHTML = '<p style="color:#8b949e;">No setups met both strict momentum and fundamental conviction criteria today. Zero trade day.</p>';
        } else {
          matchesContainer.innerHTML = buildTable(data.matches);
        }

        document.getElementById('all-table-container').innerHTML = buildTable(data.all_scanned || []);
      })
      .catch(err => {
        document.getElementById('matches-table-container').innerHTML = '<p style="color:#f85149;">Awaiting scan data...</p>';
      });

    function buildTable(list) {
      let rows = list.map(item => {
        const capCategory = item.cap_category || 'Large-Cap';
        const mcap = item.mcap_str || 'N/A';
        const pe = item.pe || 'N/A';
        const peg = item.peg || 'N/A';
        const roe = item.roe || 'N/A';
        const pLabel = item.primary_label || (item.sector_type === 'BANK' ? 'ROA' : 'D/E');
        const pVal = item.primary_val || 'N/A';
        const sLabel = item.secondary_label || (item.sector_type === 'BANK' ? 'P/B' : 'Margin');
        const sVal = item.secondary_val || 'N/A';

        return `
          <tr>
            <td>
              <a class="symbol-link" href="https://in.tradingview.com/chart/?symbol=NSE%3A${item.symbol}" target="_blank" rel="noopener noreferrer">
                ${item.symbol} ↗
              </a>
              <div style="margin-top: 3px;">
                <span class="cap-badge">${capCategory}</span>
              </div>
            </td>
            <td>
              ₹${item.price}
              <div class="subtext">${mcap}</div>
            </td>
            <td>
              -${item.pct_off_52w}%
              <div class="subtext">52W: ₹${item.high_52w}</div>
            </td>
            <td>
              ${item.vol_surge}x
              <div class="subtext">RSI: ${item.rsi}</div>
            </td>
            <td>
              <div>P/E: <b>${pe}</b></div>
              <div class="subtext">PEG: ${peg}</div>
            </td>
            <td>
              <div>ROE: <b>${roe}</b></div>
              <div class="subtext">${pLabel}: ${pVal} | ${sLabel}: ${sVal}</div>
            </td>
            <td>
              <span class="badge ${item.matched ? 'badge-match' : (item.fund_strong ? 'badge-fund-good' : 'badge-neutral')}">
                ${item.matched ? 'HIGH CONVICTION' : (item.fund_strong ? 'STRONG QUALITY' : 'NEUTRAL')}
              </span>
            </td>
          </tr>
        `;
      }).join('');

      return `
        <table>
          <thead>
            <tr>
              <th>Stock</th>
              <th>Price & M.Cap</th>
              <th>From 52W High</th>
              <th>Technicals</th>
              <th>Valuation (P/E & PEG)</th>
              <th>Quality & Solvency</th>
              <th>Conviction</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }
  </script>
</body>
</html>
