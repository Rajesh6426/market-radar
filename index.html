<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Decision Radar | Buy, Wait or Sell</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-white: #f0f6fc;
      --green: #2ea043;
      --yellow: #d29922;
      --red: #f85149;
      --link: #58a6ff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1150px;
      margin: 0 auto;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 {
      color: var(--text-white);
      margin: 0 0 4px 0;
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .timestamp {
      font-size: 12px;
      color: #8b949e;
      font-family: monospace;
    }

    /* Filter Controls Bar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 12px;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      background: #30363d;
      color: #fff;
    }
    .filter-btn.active {
      background: #1f6feb;
      border-color: #388bfd;
      color: #fff;
    }
    .filter-btn.active.buy-active {
      background: rgba(46, 160, 67, 0.25);
      border-color: #2ea043;
      color: #3fb950;
    }
    .filter-btn.active.wait-active {
      background: rgba(210, 153, 34, 0.25);
      border-color: #d29922;
      color: #e3b341;
    }
    .filter-btn.active.sell-active {
      background: rgba(248, 81, 73, 0.25);
      border-color: #f85149;
      color: #f85149;
    }

    .search-input {
      background: #0d1117;
      border: 1px solid var(--border);
      color: #fff;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      outline: none;
      width: 180px;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: #58a6ff;
      width: 220px;
    }

    .select-dropdown {
      background: #0d1117;
      border: 1px solid var(--border);
      color: #c9d1d9;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    .count-pill {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      overflow-x: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    th {
      color: #8b949e;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }
    a.symbol-link {
      color: var(--text-white);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
    a.symbol-link:hover {
      color: var(--link);
      text-decoration: underline;
    }
    .btn-checklist {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 6px;
      background: #21262d;
      color: #58a6ff;
      border: 1px solid var(--border);
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-checklist:hover {
      background: #30363d;
      border-color: #58a6ff;
    }
    .subtext {
      font-size: 11px;
      color: #8b949e;
      margin-top: 2px;
    }
    .tag-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #21262d;
      color: #8b949e;
      border: 1px solid var(--border);
    }
    .score-pill {
      display: inline-block;
      font-weight: 700;
      font-family: monospace;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
    }
    .score-high {
      background: rgba(46, 160, 67, 0.15);
      color: #3fb950;
      border: 1px solid rgba(46, 160, 67, 0.3);
    }
    .score-mid {
      background: rgba(210, 153, 34, 0.15);
      color: #d29922;
      border: 1px solid rgba(210, 153, 34, 0.3);
    }
    .score-low {
      background: rgba(248, 81, 73, 0.15);
      color: #f85149;
      border: 1px solid rgba(248, 81, 73, 0.3);
    }
    .rec-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: monospace;
    }
    .rec-buy {
      background: rgba(46, 160, 67, 0.2);
      color: #3fb950;
      border: 1px solid #2ea043;
    }
    .rec-wait {
      background: rgba(210, 153, 34, 0.2);
      color: #e3b341;
      border: 1px solid #d29922;
    }
    .rec-sell {
      background: rgba(248, 81, 73, 0.2);
      color: #f85149;
      border: 1px solid #f85149;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-buy { background: #3fb950; box-shadow: 0 0 8px #3fb950; }
    .dot-wait { background: #e3b341; }
    .dot-sell { background: #f85149; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>🎯 Institutional Stock Decision Radar</h1>
        <div class="timestamp" id="last-updated">Loading live cloud scan data...</div>
      </div>
      <div>
        <a href="stock_buying_decision_terminal.html" class="btn-checklist" style="padding: 6px 12px; font-size: 12px;">
          Open Deep Checklist ↗
        </a>
      </div>
    </header>

    <!-- Instant Filter & Search Control Panel -->
    <div class="filter-bar">
      <!-- Recommendation Filter Buttons -->
      <div class="filter-group">
        <button class="filter-btn active" onclick="setRecFilter('ALL', this)">
          All <span class="count-pill" id="count-all">0</span>
        </button>
        <button class="filter-btn" onclick="setRecFilter('BUY', this)">
          🟢 BUY <span class="count-pill" id="count-buy">0</span>
        </button>
        <button class="filter-btn" onclick="setRecFilter('WAIT', this)">
          🟡 WAIT <span class="count-pill" id="count-wait">0</span>
        </button>
        <button class="filter-btn" onclick="setRecFilter('SELL', this)">
          🔴 SELL <span class="count-pill" id="count-sell">0</span>
        </button>
      </div>

      <!-- Search & Sector Dropdown -->
      <div class="filter-group">
        <select id="sectorFilter" class="select-dropdown" onchange="applyFilters()">
          <option value="ALL">All Sectors</option>
          <option value="CORPORATE">Corporate Only</option>
          <option value="BANK/NBFC">Banks & NBFCs</option>
        </select>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="🔍 Search stock..." 
          oninput="applyFilters()"
        />
      </div>
    </div>

    <!-- Main Results Table -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span id="resultsCount" style="font-size: 12px; color: #8b949e; font-family: monospace;">Showing 0 stocks</span>
      </div>
      <table id="radarTable">
        <thead>
          <tr>
            <th>Stock</th>
            <th>CMP & M.Cap</th>
            <th>52W High Proximity</th>
            <th>Checklist Health</th>
            <th>Key Metric</th>
            <th>Audit Deep Dive</th>
            <th style="text-align: right;">Recommendation</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="7" style="text-align: center; color: #8b949e; padding: 24px;">Loading watchlist...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let globalList = [];
    let currentRecFilter = 'ALL';

    function parseNum(val) {
      if (val === null || val === undefined) return null;
      if (typeof val === 'number') return val;
      const clean = String(val).replace(/[₹,%xCr\s]/g, '');
      const parsed = parseFloat(clean);
      return isNaN(parsed) ? null : parsed;
    }

    function getRecommendation(item) {
      const isBank = (item.sector_type === 'BANK/NBFC' || item.sector_type === 'BANK');
      let de = parseNum(item.de);
      if (de !== null && de > 1.5 && item.symbol !== 'RELIANCE') {
        de = parseFloat((de / 100).toFixed(2));
      }

      const roe = parseNum(item.roe);
      const roa = parseNum(item.roa);
      const rsi = parseNum(item.rsi);
      const pct52w = parseNum(item.pct_off_52w);
      const techMatch = Boolean(item.tech_match);

      let passedRules = 0;
      let totalRules = 4;

      if (isBank) {
        if (roa !== null && roa >= 1.1) passedRules++;
        if (roe !== null && roe >= 13.0) passedRules++;
        if (pct52w !== null && pct52w <= 15.0) passedRules++;
        if (techMatch || (rsi !== null && rsi >= 48 && rsi <= 72)) passedRules++;
      } else {
        if (de !== null && de <= 0.6) passedRules++;
        if (roe !== null && roe >= 14.0) passedRules++;
        if (pct52w !== null && pct52w <= 15.0) passedRules++;
        if (techMatch || (rsi !== null && rsi >= 48 && rsi <= 72)) passedRules++;
      }

      if (passedRules >= 4 && techMatch) {
        return {
          rec: "BUY",
          badgeClass: "rec-buy",
          dotClass: "dot-buy",
          scoreText: `${passedRules}/${totalRules} Passed`,
          scoreClass: "score-high"
        };
      } else if (passedRules >= 2) {
        return {
          rec: "WAIT",
          badgeClass: "rec-wait",
          dotClass: "dot-wait",
          scoreText: `${passedRules}/${totalRules} Passed`,
          scoreClass: "score-mid"
        };
      } else {
        return {
          rec: "SELL",
          badgeClass: "rec-sell",
          dotClass: "dot-sell",
          scoreText: `${passedRules}/${totalRules} Passed`,
          scoreClass: "score-low"
        };
      }
    }

    function setRecFilter(type, btn) {
      currentRecFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('active', 'buy-active', 'wait-active', 'sell-active');
      });

      btn.classList.add('active');
      if (type === 'BUY') btn.classList.add('buy-active');
      if (type === 'WAIT') btn.classList.add('wait-active');
      if (type === 'SELL') btn.classList.add('sell-active');

      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toUpperCase();
      const sectorChoice = document.getElementById('sectorFilter').value;

      const filtered = globalList.filter(item => {
        // 1. Recommendation Filter
        if (currentRecFilter !== 'ALL' && item._computedRec.rec !== currentRecFilter) {
          return false;
        }

        // 2. Sector Filter
        if (sectorChoice !== 'ALL') {
          const itemSector = (item.sector_type === 'BANK/NBFC' || item.sector_type === 'BANK') ? 'BANK/NBFC' : 'CORPORATE';
          if (itemSector !== sectorChoice) return false;
        }

        // 3. Search Query Filter
        if (query && !item.symbol.toUpperCase().includes(query)) {
          return false;
        }

        return true;
      });

      renderTable(filtered);
    }

    function renderTable(list) {
      document.getElementById('resultsCount').innerText = `Showing ${list.length} of ${globalList.length} stocks`;

      if (list.length === 0) {
        document.getElementById('tableBody').innerHTML = `
          <tr><td colspan="7" style="text-align: center; color: #8b949e; padding: 32px;">No stocks match your active filter.</td></tr>
        `;
        return;
      }

      const rows = list.map(item => {
        const recData = item._computedRec;
        const sectorParam = (item.sector_type === 'BANK/NBFC' || item.sector_type === 'BANK') ? 'bank' : 'general';
        const terminalUrl = `stock_buying_decision_terminal.html?symbol=${encodeURIComponent(item.symbol)}&cmp=${encodeURIComponent(item.price)}&sector=${sectorParam}`;

        let deClean = item.de;
        let deNum = parseNum(item.de);
        if (deNum !== null && deNum > 1.5 && item.symbol !== 'RELIANCE') {
          deClean = (deNum / 100).toFixed(2) + 'x';
        }

        const primaryMetric = sectorParam === 'bank' 
          ? `ROA: <b>${item.roa || 'N/A'}</b> | ROE: <b>${item.roe || 'N/A'}</b>` 
          : `D/E: <b>${deClean || 'N/A'}</b> | ROE: <b>${item.roe || 'N/A'}</b>`;

        return `
          <tr>
            <td>
              <a class="symbol-link" href="https://in.tradingview.com/chart/?symbol=NSE%3A${item.symbol}" target="_blank" title="View Chart">
                ${item.symbol} ↗
              </a>
              <div style="margin-top: 4px; display: flex; gap: 4px;">
                <span class="tag-badge">${item.cap_category || 'Large-Cap'}</span>
                <span class="tag-badge">${item.sector_type || 'CORPORATE'}</span>
              </div>
            </td>
            <td>
              <div style="font-weight: 700; color: #fff;">₹${item.price}</div>
              <div class="subtext">${item.mcap_str || 'N/A'}</div>
            </td>
            <td>
              <div style="color: ${item.pct_off_52w <= 10 ? '#3fb950' : '#c9d1d9'}; font-weight: 600;">
                -${item.pct_off_52w}%
              </div>
              <div class="subtext">52W: ₹${item.high_52w}</div>
            </td>
            <td>
              <span class="score-pill ${recData.scoreClass}">${recData.scoreText}</span>
              <div class="subtext">RSI: ${item.rsi} | Vol: ${item.vol_surge}x</div>
            </td>
            <td>
              <div style="font-size: 12px;">${primaryMetric}</div>
              <div class="subtext">Margin: ${item.net_margin || 'N/A'} | P/E: ${item.pe || 'N/A'}</div>
            </td>
            <td>
              <a href="${terminalUrl}" class="btn-checklist">
                View Checklist 📋
              </a>
            </td>
            <td style="text-align: right;">
              <span class="rec-badge ${recData.badgeClass}">
                <span class="dot ${recData.dotClass}"></span>
                ${recData.rec}
              </span>
            </td>
          </tr>
        `;
      }).join('');

      document.getElementById('tableBody').innerHTML = rows;
    }

    fetch('results.json?v=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        document.getElementById('last-updated').innerText = `Last Cloud Scan: ${data.last_updated}`;
        globalList = data.all_scanned || [];

        // Pre-compute recommendations and counts
        let buyCount = 0, waitCount = 0, sellCount = 0;
        globalList.forEach(item => {
          item._computedRec = getRecommendation(item);
          if (item._computedRec.rec === 'BUY') buyCount++;
          else if (item._computedRec.rec === 'WAIT') waitCount++;
          else sellCount++;
        });

        // Update count pills
        document.getElementById('count-all').innerText = globalList.length;
        document.getElementById('count-buy').innerText = buyCount;
        document.getElementById('count-wait').innerText = waitCount;
        document.getElementById('count-sell').innerText = sellCount;

        applyFilters();
      })
      .catch(err => {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" style="text-align: center; color: #f85149; padding: 24px;">Failed to load scan data.</td></tr>';
      });
  </script>
</body>
</html>
