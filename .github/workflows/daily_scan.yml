name: Market Radar Scanner

on:
  schedule:
    # Runs Monday to Friday (1-5) every 2 hours during market hours
    # 04:15 UTC = 09:45 AM IST
    # 06:15 UTC = 11:45 AM IST
    # 08:15 UTC = 01:45 PM IST
    # 10:15 UTC = 03:45 PM IST
    - cron: '15 4,6,8,10 * * 1-5'

  workflow_dispatch: # Allows manual one-click runs anytime from the GitHub website

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pytz

      - name: Run Market Scanner
        run: python scanner.py

      - name: Commit and Push Updated Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated market scan update [skip ci]" && git push)