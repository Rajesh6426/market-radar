<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Decision Terminal | Buy, Wait or Sell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            dark: {
              900: '#0a0d14',
              850: '#0f1420',
              800: '#141b2d',
              750: '#1c2438',
              700: '#232d46',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Fix native select option background and text contrast */
    select option {
      background-color: #141b2d;
      color: #f1f5f9;
      padding: 6px 10px;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    @media print {
      body { background: white !important; color: black !important; }
      .no-print { display: none !important; }
      .print-show { display: block !important; }
      .card-box { border: 1px solid #ddd !important; background: white !important; color: black !important; page-break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-dark-900 text-slate-100 font-sans min-h-screen antialiased selection:bg-emerald-500 selection:text-white">

  <div class="max-w-4xl mx-auto px-4 py-8 space-y-6">

    <!-- Header with Quick Switcher -->
    <div class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-800">
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-dark-800 hover:bg-dark-750 border border-slate-700 text-slate-300 transition-all">
          ← Back to Radar
        </a>
        <h1 class="text-xl font-bold text-white font-mono">PRE-TRADE AUDIT</h1>
      </div>

      <div class="flex items-center gap-2">
        <div class="flex items-center gap-2 bg-dark-800 border border-slate-700 px-3 py-1.5 rounded-xl">
          <span class="text-xs text-slate-400 font-semibold">Stock:</span>
          <select id="stockSelector" class="bg-transparent text-xs font-mono font-bold text-white focus:outline-none cursor-pointer">
            <option value="" disabled selected>Loading...</option>
          </select>
        </div>
        <button onclick="window.print()" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-dark-800 hover:bg-dark-750 border border-slate-700 text-slate-300">
          Print / PDF
        </button>
      </div>
    </div>

    <!-- Main Verdict Card -->
    <div class="bg-dark-850 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-6">
      <div>
        <div class="flex items-center gap-3">
          <h2 id="stockTitle" class="text-3xl font-black text-white font-mono uppercase tracking-tight">--</h2>
          <span id="sectorBadge" class="text-xs px-2.5 py-0.5 rounded-full font-mono font-bold bg-dark-750 text-slate-300 border border-slate-700">CORPORATE</span>
        </div>
        <p id="companyMeta" class="text-xs text-slate-400 mt-1.5 font-mono">Loading data...</p>
      </div>

      <div class="text-right">
        <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400 block">Decision</span>
        <div id="verdictBox" class="inline-flex items-center gap-2 mt-1 px-5 py-2 rounded-xl text-lg font-black font-mono border">
          ANALYZING...
        </div>
      </div>
    </div>

    <!-- Trade Execution Levels -->
    <div class="grid grid-cols-3 gap-3 text-center">
      <div class="bg-dark-850 p-3.5 rounded-xl border border-slate-800">
        <span class="text-[10px] uppercase font-bold text-slate-400 block">Entry (CMP)</span>
        <span id="cmpVal" class="text-base font-bold font-mono text-white mt-0.5 block">₹0.00</span>
      </div>
      <div class="bg-dark-850 p-3.5 rounded-xl border border-slate-800">
        <span class="text-[10px] uppercase font-bold text-emerald-400 block">Target (+20% / 52W)</span>
        <span id="targetVal" class="text-base font-bold font-mono text-emerald-400 mt-0.5 block">₹0.00</span>
      </div>
      <div class="bg-dark-850 p-3.5 rounded-xl border border-slate-800">
        <span class="text-[10px] uppercase font-bold text-rose-400 block">Stop Loss (-6%)</span>
        <span id="slVal" class="text-base font-bold font-mono text-rose-400 mt-0.5 block">₹0.00</span>
      </div>
    </div>

    <!-- The 8-Point Institutional Checklist -->
    <div class="bg-dark-850 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-800">
        <h3 class="text-xs font-bold text-white uppercase tracking-wider font-mono">Automated Decision Checklist</h3>
        <span id="scoreBadge" class="text-xs font-mono font-bold text-slate-400">0 / 8 Passed</span>
      </div>
      <div id="checklistItems" class="space-y-2.5"></div>
    </div>

  </div>

  <script>
    let globalWatchlist = [];

    function parseNum(val) {
      if (val === null || val === undefined) return null;
      if (typeof val === 'number') return val;
      const clean = String(val).replace(/[₹,%xCr\s]/g, '');
      const parsed = parseFloat(clean);
      return isNaN(parsed) ? null : parsed;
    }

    function rowHtml(title, pass, metricText) {
      return `
        <div class="p-3 rounded-xl border flex items-center justify-between gap-3 ${pass ? 'bg-emerald-950/20 border-emerald-500/30' : 'bg-dark-800 border-slate-800'}">
          <div>
            <div class="text-xs font-semibold ${pass ? 'text-emerald-300' : 'text-slate-200'}">${title}</div>
            <div class="text-[11px] font-mono text-cyan-400 mt-0.5">${metricText}</div>
          </div>
          <span class="text-[10px] px-2.5 py-0.5 rounded font-mono font-bold shrink-0 ${pass ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-rose-500/20 text-rose-300 border border-rose-500/40'}">
            ${pass ? 'PASS ✓' : 'FAIL ✗'}
          </span>
        </div>
      `;
    }

    function renderStockDetails(stock) {
      if (!stock) return;

      const isBank = (stock.sector_type === 'BANK/NBFC' || stock.sector_type === 'BANK');
      
      let deVal = parseNum(stock.de);
      if (deVal !== null && deVal > 1.5) {
        deVal = parseFloat((deVal / 100).toFixed(2));
      }

      const roe = parseNum(stock.roe);
      const roa = parseNum(stock.roa);
      const pb = parseNum(stock.pb);
      const pe = parseNum(stock.pe);
      const peg = parseNum(stock.peg);
      const margin = parseNum(stock.net_margin);
      const rsi = parseNum(stock.rsi);
      const pct52w = parseNum(stock.pct_off_52w);
      const cmp = parseFloat(stock.price) || 0;
      const high52 = parseFloat(stock.high_52w) || Math.round(cmp * 1.20);
      const target = Math.max(high52, Math.round(cmp * 1.18));
      const sl = Math.round(cmp * 0.94);

      document.getElementById('stockTitle').textContent = stock.symbol;
      document.getElementById('sectorBadge').textContent = stock.sector_type || 'CORPORATE';
      document.getElementById('companyMeta').textContent = `M.Cap: ${stock.mcap_str || 'N/A'} | 52W High: ₹${high52} | RSI: ${stock.rsi || 'N/A'}`;

      document.getElementById('cmpVal').textContent = `₹${cmp.toLocaleString('en-IN')}`;
      document.getElementById('targetVal').textContent = `₹${target.toLocaleString('en-IN')}`;
      document.getElementById('slVal').textContent = `₹${sl.toLocaleString('en-IN')}`;

      let items = [];
      if (isBank) {
        items = [
          { label: "1. Asset Quality (ROA ≥ 1.1%)", pass: roa !== null && roa >= 1.1, val: `ROA: ${stock.roa || 'N/A'}` },
          { label: "2. Capital Compounding (ROE ≥ 13%)", pass: roe !== null && roe >= 13.0, val: `ROE: ${stock.roe || 'N/A'}` },
          { label: "3. Valuation Multiple (P/B ≤ 2.5x)", pass: pb !== null && pb <= 2.5, val: `P/B: ${stock.pb || 'N/A'}` },
          { label: "4. Operating Margin Cushion", pass: margin !== null && margin >= 15.0, val: `Margin: ${stock.net_margin || 'N/A'}` },
          { label: "5. Earnings Growth (P/E OK)", pass: pe !== null && pe <= 30.0, val: `P/E: ${stock.pe || 'N/A'}` },
          { label: "6. Proximity to 52-Week High (≤ 15% Dip)", pass: pct52w !== null && pct52w <= 15.0, val: `Off High: -${stock.pct_off_52w}%` },
          { label: "7. Moving Average Trend (Above 20 & 50 EMA)", pass: Boolean(stock.tech_match), val: stock.tech_match ? "Bullish Alignment" : "Consolidating" },
          { label: "8. RSI Momentum in Healthy Zone (48 - 72)", pass: rsi !== null && rsi >= 48 && rsi <= 72, val: `RSI: ${stock.rsi || 'N/A'}` }
        ];
      } else {
        items = [
          { label: "1. Debt-to-Equity Balance Sheet Safety (≤ 0.5x)", pass: deVal !== null ? deVal <= 0.5 : true, val: `D/E: ${deVal !== null ? deVal + 'x' : '0.00x (Debt-Free)'}` },
          { label: "2. High Return on Equity (ROE ≥ 14%)", pass: roe !== null && roe >= 14.0, val: `ROE: ${stock.roe || 'N/A'}` },
          { label: "3. Net Profit Margin Strength (≥ 10%)", pass: margin !== null && margin >= 10.0, val: `Margin: ${stock.net_margin || 'N/A'}` },
          { label: "4. Solvency Cushion (Low Long-Term Debt)", pass: deVal !== null ? deVal <= 0.8 : true, val: `Total Debt: ${stock.total_debt || '₹0 Cr'}` },
          { label: "5. Valuation Sanity (PEG ≤ 2.2 / P/E ≤ 42x)", pass: (peg !== null ? peg <= 2.2 : (pe !== null && pe <= 42)), val: `P/E: ${stock.pe || 'N/A'} | PEG: ${stock.peg || 'N/A'}` },
          { label: "6. Proximity to 52-Week High (≤ 15% Dip)", pass: pct52w !== null && pct52w <= 15.0, val: `Off High: -${stock.pct_off_52w}%` },
          { label: "7. Moving Average Trend (Above 20 & 50 EMA)", pass: Boolean(stock.tech_match), val: stock.tech_match ? "Bullish Alignment" : "Consolidating" },
          { label: "8. RSI Momentum in Healthy Zone (48 - 72)", pass: rsi !== null && rsi >= 48 && rsi <= 72, val: `RSI: ${stock.rsi || 'N/A'}` }
        ];
      }

      const passedCount = items.filter(i => i.pass).length;
      document.getElementById('checklistItems').innerHTML = items.map(i => rowHtml(i.label, i.pass, i.val)).join('');
      document.getElementById('scoreBadge').textContent = `${passedCount} / ${items.length} Passed`;

      const verdictBox = document.getElementById('verdictBox');
      if (passedCount >= 7 && stock.tech_match) {
        verdictBox.className = "inline-flex items-center gap-2 mt-1 px-5 py-2 rounded-xl text-lg font-black font-mono bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
        verdictBox.innerHTML = '🟢 BUY';
      } else if (passedCount >= 4) {
        verdictBox.className = "inline-flex items-center gap-2 mt-1 px-5 py-2 rounded-xl text-lg font-black font-mono bg-yellow-500/20 text-yellow-300 border border-yellow-500/40";
        verdictBox.innerHTML = '🟡 WAIT';
      } else {
        verdictBox.className = "inline-flex items-center gap-2 mt-1 px-5 py-2 rounded-xl text-lg font-black font-mono bg-rose-500/20 text-rose-300 border border-rose-500/40";
        verdictBox.innerHTML = '🔴 SELL';
      }
    }

    async function initChecklistPage() {
      try {
        const res = await fetch('results.json?v=' + new Date().getTime());
        const data = await res.json();
        globalWatchlist = data.all_scanned || [];
        if (globalWatchlist.length === 0) return;

        const sel = document.getElementById('stockSelector');
        sel.innerHTML = globalWatchlist.map(s => `
          <option value="${s.symbol}">${s.symbol} (${s.conviction_tag || 'HOLD'})</option>
        `).join('');

        const params = new URLSearchParams(window.location.search);
        const urlSymbol = params.get('symbol');

        let targetStock = globalWatchlist[0];
        if (urlSymbol) {
          const match = globalWatchlist.find(s => s.symbol.toUpperCase() === urlSymbol.toUpperCase());
          if (match) targetStock = match;
        }

        sel.value = targetStock.symbol;
        renderStockDetails(targetStock);

        sel.addEventListener('change', () => {
          const picked = globalWatchlist.find(s => s.symbol === sel.value);
          if (picked) {
            const newUrl = `${window.location.pathname}?symbol=${encodeURIComponent(picked.symbol)}`;
            window.history.pushState({ path: newUrl }, '', newUrl);
            renderStockDetails(picked);
          }
        });

      } catch (err) {
        console.error(err);
      }
    }

    window.addEventListener('DOMContentLoaded', initChecklistPage);
  </script>
</body>
</html>
